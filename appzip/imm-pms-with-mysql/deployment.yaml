# App + MySQL in one pod. MySQL image must already exist on the node
# (docker pull mysql:8.0) OR be imported separately — App Management zip
# typically imports only imm-pms-v1.0.0.tar; pull mysql:8.0 on the gateway first.
#
# IMPORTANT: emptyDir loses DB on pod restart. Replace mysql-data with a PVC
# before any real production use of this pattern.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: imm-pms
  labels:
    app: imm-pms
spec:
  replicas: 1
  selector:
    matchLabels:
      app: imm-pms
  template:
    metadata:
      labels:
        app: imm-pms
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          imagePullPolicy: IfNotPresent
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                configMapKeyRef:
                  name: imm-pms-config
                  key: MYSQL_ROOT_PASSWORD
            - name: MYSQL_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: imm-pms-config
                  key: MYSQL_DATABASE
            - name: MYSQL_USER
              valueFrom:
                configMapKeyRef:
                  name: imm-pms-config
                  key: MYSQL_USER
            - name: MYSQL_PASSWORD
              valueFrom:
                configMapKeyRef:
                  name: imm-pms-config
                  key: MYSQL_PASSWORD
          ports:
            - name: mysql
              containerPort: 3306
          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql
          readinessProbe:
            exec:
              command: ["mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p$(MYSQL_ROOT_PASSWORD)"]
            initialDelaySeconds: 20
            periodSeconds: 10

        - name: imm-pms
          image: imm-pms:v1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          envFrom:
            - configMapRef:
                name: imm-pms-config
          volumeMounts:
            - name: static-data
              mountPath: /app/backend/static
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "2Gi"

      volumes:
        - name: mysql-data
          emptyDir: {}
        - name: static-data
          emptyDir: {}