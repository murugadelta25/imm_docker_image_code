apiVersion: v1
kind: Service
metadata:
  name: imm-pms
  labels:
    app: imm-pms
spec:
  type: ClusterIP
  selector:
    app: imm-pms
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
