# NodePort for factory PCs — SIE keeps :80; IMM UI on nodePort 30080 → container 8080
apiVersion: v1
kind: Service
metadata:
  name: imm-pms
  labels:
    app: imm-pms
spec:
  type: NodePort
  selector:
    app: imm-pms
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30080
      protocol: TCP
