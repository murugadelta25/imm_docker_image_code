# Gateway-ready: hostNetwork so pod can reach MySQL on 127.0.0.1:3306
# nginx in image listens on 8080 (avoids clash with SIE on :80)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: imm-pms
  labels:
    app: imm-pms
spec:
  replicas: 1
  selector:
    matchLabels:
      app: imm-pms
  template:
    metadata:
      labels:
        app: imm-pms
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: imm-pms
          image: imm-pms:v1.0.0
          # Master registry alternative:
          # image: master:32000/imm-pms:v1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: imm-pms-config
          volumeMounts:
            - name: static-data
              mountPath: /app/backend/static
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 45
            periodSeconds: 30
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "2Gi"
      volumes:
        - name: static-data
          emptyDir: {}
          # Prefer PVC in production:
          # persistentVolumeClaim:
          #   claimName: imm-pms-static
