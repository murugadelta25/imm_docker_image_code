worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    client_max_body_size 25m;

    # Access / error logs to stdout/stderr for Kubernetes
    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    upstream imm_api {
        # Must match IMM_API_PORT / entrypoint default (18040 — avoids host :8040 clash)
        server 127.0.0.1:18040;
        keepalive 16;
    }

    server {
        # 8080 avoids clash with SIE/EAP nginx on host :80 when using hostNetwork
        listen 8080;
        server_name _;

        # SPA + static assets (Vite base may be / or /app/.../)
        root /usr/share/nginx/html;
        index index.html;

        # Backend API
        location /api/ {
            proxy_pass http://imm_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }

        # Uploaded images / work instructions
        location /static/ {
            proxy_pass http://imm_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_read_timeout 120s;
        }

        # Health (backend)
        location = /health {
            proxy_pass http://imm_api/health;
            proxy_http_version 1.1;
        }

        location = /health/db {
            proxy_pass http://imm_api/health/db;
            proxy_http_version 1.1;
        }

        # WebSocket
        location /ws {
            proxy_pass http://imm_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # React SPA — support App Management Ingress basename
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}