# MicroK8s Ingress + ExternalName services to route din.eappms → host ports
# Apply with: microk8s kubectl apply -f k8s-ingress.yaml
---
apiVersion: v1
kind: Service
metadata:
  name: eap-frontend
  namespace: eap-pms
spec:
  type: ExternalName
  externalName: 172.16.28.251
  ports:
    - name: http
      port: 5174
      targetPort: 5174
---
apiVersion: v1
kind: Service
metadata:
  name: eap-backend
  namespace: eap-pms
spec:
  type: ExternalName
  externalName: 172.16.28.251
  ports:
    - name: http
      port: 8040
      targetPort: 8040
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: eap-pms-ingress
  namespace: eap-pms
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "86400"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-body-size: "25m"
    nginx.ingress.kubernetes.io/upstream-vhost: "127.0.0.1"
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
spec:
  ingressClassName: public
  rules:
    - host: din.eappms
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: eap-backend
                port:
                  number: 8040
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: eap-backend
                port:
                  number: 8040
          - path: /static
            pathType: Prefix
            backend:
              service:
                name: eap-backend
                port:
                  number: 8040
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: eap-backend
                port:
                  number: 8040
          - path: /docs
            pathType: Prefix
            backend:
              service:
                name: eap-backend
                port:
                  number: 8040
          - path: /
            pathType: Prefix
            backend:
              service:
                name: eap-frontend
                port:
                  number: 5174
